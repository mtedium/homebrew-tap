name: 更新 Cask

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: 测试官网下载解析
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: 获取官网安装包并核验更新
        run: python3 scripts/update_irightmouse.py
      - name: 创建或更新 PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto-update/update-irightmouse-pro
          delete-branch: true
          add-paths: Casks/irightmouse-pro.rb
          commit-message: '⬆️ chore(cask): 更新超级右键专业版'
          title: '更新超级右键专业版'
          body: |
            从 aodo365.com 官网下载按钮重新解析完整下载地址。
            已核实 DMG 中的应用标识、版本和构建号，并重新计算 SHA256。
            合并后，用户可通过 brew upgrade --cask mtedium/tap/irightmouse-pro 升级。
