name: 更新 Cask

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        software: [irightmouse, trae]
    steps:
      - uses: actions/checkout@v6
      - name: 测试官网下载解析
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: 获取官网安装包并核验更新
        run: python3 scripts/update_${{ matrix.software }}.py
      - name: 创建或更新 PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto-update/${{ matrix.software }}
          delete-branch: true
          add-paths: Casks/*.rb
          commit-message: '⬆️ chore(cask): 更新 ${{ matrix.software }}'
          title: '更新 ${{ matrix.software }}'
          body: |
            从软件官方来源重新取得完整下载地址。
            已核实 DMG 中的应用标识、版本（超级右键同时核验构建号），并重新计算 SHA256。
            合并后，用户可通过 brew upgrade --cask 升级。
